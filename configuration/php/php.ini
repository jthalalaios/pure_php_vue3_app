; ============================================================
; Custom PHP settings — loaded by every php-fpm worker
; Redis session config is written at container startup by
; entrypoint.sh into session-redis.ini so the host/port come
; from environment variables.
; ============================================================

; ---- Security -----------------------------------------------
expose_php          = Off
allow_url_fopen     = Off
allow_url_include   = Off

; ---- Error handling -----------------------------------------
display_errors      = On
log_errors          = On
error_reporting     = E_ALL
error_log           = /proc/self/fd/2

; ---- Resource limits ----------------------------------------
memory_limit        = 256M
max_execution_time  = 60
upload_max_filesize = 32M
post_max_size       = 32M

; ---- OPcache ------------------------------------------------
opcache.enable                 = 1
opcache.memory_consumption     = 128
opcache.max_accelerated_files  = 10000
opcache.validate_timestamps    = 1
opcache.revalidate_freq        = 2
opcache.interned_strings_buffer = 16
