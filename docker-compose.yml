services:
  php-app:
    build:
      context: .
      dockerfile: ./configuration/app_conf/Dockerfile
    container_name: php-app
    working_dir: /var/www/html
    restart: unless-stopped
    tty: true
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HOST_UID=${UID}
      - HOST_GID=${GID}
      - WORKER_COUNT=0
      - DB_HOST=postgres
      - DB_PORT=${POSTGRES_DB_PORT:-5432}
      - DB_DATABASE=${POSTGRES_DB_DATABASE}
      - DB_USERNAME=${POSTGRES_DB_USERNAME}
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - REDIS_HOST=redis-alpine
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-${APP_NAME}}
    volumes:
      - ./php-app:/var/www/html
    networks:
      - php-vue3-app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis-alpine:
        condition: service_healthy

  email-worker:
    build:
      context: .
      dockerfile: ./configuration/app_conf/Dockerfile
    container_name: email-worker
    command: php /var/www/html/workers/email_worker.php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HOST_UID=${UID}
      - HOST_GID=${GID}
      - DB_HOST=postgres
      - DB_PORT=${POSTGRES_DB_PORT:-5432}
      - DB_DATABASE=${POSTGRES_DB_DATABASE}
      - DB_USERNAME=${POSTGRES_DB_USERNAME}
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - REDIS_HOST=redis-alpine
      - REDIS_PORT=${REDIS_PORT:-6379}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-${APP_NAME}}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./php-app:/var/www/html
    networks:
      - php-vue3-app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis-alpine:
        condition: service_healthy

  vue3-fronted:
    build:
      context: .
      dockerfile: ./configuration/fronted_conf/Dockerfile
    container_name: vue3-fronted
    restart: unless-stopped
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_PORT=${VITE_PORT}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./vue3-fronted:/app
      - /app/node_modules
      - type: volume
        source: vue3-fronted-data
        target: /app/logs
    networks:
      - php-vue3-app-network

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    restart: always
    tty: true
    environment:
      - POSTGRES_DB=${POSTGRES_DB_DATABASE}
      - POSTGRES_USER=${POSTGRES_DB_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    ports:
      - "${POSTGRES_DB_HOST_PORT}:${POSTGRES_DB_PORT}"
    volumes:
      - ./configuration/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    networks:
      - php-vue3-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USERNAME} -d ${POSTGRES_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
         
  redis-alpine:
    image: redis:alpine
    container_name: redis-alpine
    restart: always
    command: redis-server 
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    networks:
      - php-vue3-app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  nginx:
    image: nginx:1.31.4-alpine
    container_name: nginx-1-31-4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_HOST_PORT}:${HTTP_PORT}"
    volumes:
      - ./configuration/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./php-app:/var/www/html
    depends_on:
      - php-app
    networks:
      - php-vue3-app-network

volumes:
  php-app:
    name: php-app-data-logs
  vue3-fronted-data:
    name: vue3-fronted-data-logs
  postgres-data:
    name: postgres-data-logs
  redis-data:
    name: redis-alpine-logs

  nginx-conf:
  nginx-host:
  nginx-html:
  nginx-certs:
  acme:
  
networks:
  php-vue3-app-network:
    driver: bridge
    #in case network existing already and dont have to create it automatically
    #external: true
